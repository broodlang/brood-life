name: CI

# The gate a Brood package needs: does it still CHECK, FORMAT and TEST against the
# current brood toolchain?
#
# It exists because its absence had a cost. hatch was broken from brood 0.11.0 —
# `(/stop sup)` reached for a root `stop` that had become `gen/stop` — and nothing
# noticed for two releases, until a hive deploy crash-looped in production on a
# DIFFERENT stale name. A package pinned by git ref with no CI is a package whose
# breakage is discovered by whoever deploys it.
#
# brood is built from source rather than downloaded: there is no release binary
# feed yet, and pinning `main` is what makes this an early-warning signal for the
# whole ecosystem instead of a check against a frozen toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: check + format + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The toolchain is the expensive part, so it is cached on the brood commit it
      # was built from — a brood push invalidates it, which is exactly when a rebuild
      # is wanted.
      - name: Resolve brood HEAD
        id: brood
        run: echo "sha=$(git ls-remote https://github.com/broodlang/brood.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache the brood toolchain
        id: cache-brood
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: brood-bin-${{ runner.os }}-${{ steps.brood.outputs.sha }}

      - name: Build brood
        if: steps.cache-brood.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/broodlang/brood.git /tmp/brood
          cd /tmp/brood
          # `cargo build` rather than `make install`: the default cargo features already
          # include `dev-tools`, which is what carries `nest test` — the lean
          # `RUN_FEATURES` build does NOT have it, so a package's suite could not run.
          # Going through cargo also skips ./configure and the gui/audio system-library
          # question entirely, which a bare runner does not have.
          cargo build --release --bin brood --bin nest
          mkdir -p "$HOME/.local/bin"
          cp target/release/brood target/release/nest "$HOME/.local/bin/"

      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          [ -f project.blsp ] && nest fetch || echo "no project.blsp — nothing to fetch"

      - name: nest check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nest check

      - name: nest format --check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nest format --check

      - name: nest test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nest test
